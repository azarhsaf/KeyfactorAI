services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keyfactorai
      POSTGRES_USER: keyfactorai
      POSTGRES_PASSWORD: keyfactorai_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyfactorai -d keyfactorai"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    expose:
      - "8000"

  frontend:
    build: ./frontend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  ollama_data:
